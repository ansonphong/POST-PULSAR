[build-system]
requires = ["setuptools>=75.6"]
build-backend = "setuptools.build_meta"

[project]
name = "post-pulsar"
version = "0.1.0"
description = "Social media publishing automation"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
authors = [{ name = "Anson Phong" }]
dependencies = [
    "instagrapi==2.1.3",
    "Pillow==11.0.0",
    "python-dotenv==1.0.1",
    "tweepy==4.14.0",
]

[project.scripts]
post-pulsar = "post_pulsar:main"

[project.optional-dependencies]
dev = [
    "mypy==1.13.0",
    "pytest==8.3.4",
    "pytest-socket==0.7.0",
    "ruff==0.8.2",
    "uv==0.5.11",
]

[dependency-groups]
dev = [
    "mypy==1.13.0",
    "pytest==8.3.4",
    "pytest-socket==0.7.0",
    "ruff==0.8.2",
    "uv==0.5.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["post_pulsar"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--disable-socket"]
testpaths = ["tests"]
