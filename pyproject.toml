[build-system]
requires = ["setuptools>=75.6"]
build-backend = "setuptools.build_meta"

[project]
name = "post-pulsar"
version = "0.1.0"
description = "Social media publishing automation"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
authors = [{ name = "Anson Phong" }]
dependencies = [
    "filelock>=3.32.5,<4",
    "httpx>=0.28.1,<1",
    "Pillow>=12.3.0,<13",
    "platformdirs>=4.11.7,<5",
    "pydantic>=2.13.5,<3",
    "twitter-text-parser>=3.0.0,<4",
    "tzdata>=2025.3",
]

[project.scripts]
post-pulsar = "post_pulsar:main"

[project.optional-dependencies]
dev = [
    "build>=1.6.0,<2",
    "mypy>=2.3.1,<3",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-socket>=0.8.1,<1",
    "respx>=0.23.1,<1",
    "ruff>=0.16.6,<1",
    "uv==0.12.10",
]

[dependency-groups]
dev = [
    "build>=1.6.0,<2",
    "mypy>=2.3.1,<3",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-socket>=0.8.1,<1",
    "respx>=0.23.1,<1",
    "ruff>=0.16.6,<1",
    "uv==0.12.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["post_pulsar"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--disable-socket"]
testpaths = ["tests"]
