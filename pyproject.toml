[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "post-pulsar"
version = "0.1.0"
description = "Social media publishing automation"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE.md"]
authors = [{ name = "Anson Phong" }]
dependencies = [
    "filelock>=3.32.5,<4",
    "httpx>=0.28.1,<1",
    "Pillow>=12.3.0,<13",
    "platformdirs>=4.11.7,<5",
    "pydantic>=2.13.5,<3",
    "tzdata>=2026.3",
]

[project.scripts]
post-pulsar = "post_pulsar:main"

[project.optional-dependencies]
dev = [
    "build>=1.6.0,<2",
    "jsonschema==4.26.0",
    "mypy>=2.3.1,<3",
    "openapi-spec-validator==0.7.2",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-socket>=0.8.1,<1",
    "respx>=0.23.1,<1",
    "ruff>=0.16.6,<1",
    "setuptools==84.0.0",
    "uv==0.12.10",
    "wheel>=0.46.1,<1",
]

[dependency-groups]
dev = [
    "build>=1.6.0,<2",
    "jsonschema==4.26.0",
    "mypy>=2.3.1,<3",
    "openapi-spec-validator==0.7.2",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-socket>=0.8.1,<1",
    "respx>=0.23.1,<1",
    "ruff>=0.16.6,<1",
    "setuptools==84.0.0",
    "uv==0.12.10",
    "wheel>=0.46.1,<1",
]

[tool.uv]
# Lock resolution refreshed on 2026-09-05; exclude later uploads.
exclude-newer = "2026-09-06T00:00:00Z"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
post_pulsar = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S311"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["post_pulsar"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--disable-socket"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["post_pulsar"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
